repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          # Versions pinned from poetry.lock to keep the pre-commit mypy hook
          # (which runs in an isolated venv) deterministic across CI + local
          # runs. Bump in lock-step with poetry.lock when those deps move.
          - pydantic==2.13.3
          - pydantic-settings==2.13.1
          - types-PyYAML==6.0.12.20260408
        exclude: ^(tests/)

  - repo: local
    hooks:
      - id: env-contract-lint
        name: env-contract-lint
        language: python
        entry: python tools/check_env_contract.py
        pass_filenames: false
        always_run: true
        additional_dependencies: [pyyaml]
