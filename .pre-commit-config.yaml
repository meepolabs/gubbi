repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          # Versions pinned from poetry.lock to keep the pre-commit mypy hook
          # (which runs in an isolated venv) deterministic across CI + local
          # runs. Bump in lock-step with poetry.lock when those deps move.
          - pydantic==2.13.3
          - pydantic-settings==2.13.1
          - types-PyYAML==6.0.12.20260408
        exclude: ^(tests/)

  # Secret scanning at commit time. The CI gitleaks workflow is the
  # second line of defense; this hook catches leaks before they reach
  # the remote.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: env-contract-lint
        name: env-contract-lint
        language: python
        entry: python tools/check_env_contract.py
        pass_filenames: false
        always_run: true
        additional_dependencies: [pyyaml]
      # Ban accidental doubled JOURNAL_ prefix in env var names.
      # Trips when a pydantic Settings field named journal_<name> under
      # env_prefix="JOURNAL_" silently produces JOURNAL_JOURNAL_<NAME>.
      # Allowlists JOURNAL_JOURNAL_TARGET_URL (rename deferred).
      - id: check-no-double-prefix
        name: check-no-double-prefix
        language: python
        language_version: python3.12
        entry: python -m gubbi_common.tools.check_no_double_prefix
        additional_dependencies:
          - "gubbi-common @ git+https://github.com/meepolabs/gubbi-common.git@ce7e2a4"
