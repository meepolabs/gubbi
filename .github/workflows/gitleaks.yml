# Secret scanning.
#
# Pull requests are scanned through ci.yml, whose `secret-scan` job calls
# this workflow as a dependency of its `required` job. Pushes to main/develop
# are scanned both there and by this workflow's own push trigger: the ci.yml
# run is cancelled by a newer push, this one is not, and its concurrency
# group is keyed on the commit SHA, so a newer push can neither cancel nor
# displace the scan of an earlier one. A weekly full-history scan catches
# anything historical that slipped past the diff scans.

name: gitleaks

on:
  workflow_call:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'
  # Manual trigger. Without it a push- or cron-driven scan cannot be forced,
  # so a repin or trigger fix has to wait for the next real event to prove it
  # works -- and a workflow GitHub has disabled for inactivity looks identical
  # to a misconfigured one.
  workflow_dispatch:


# Keyed on event_name, so a push never cancels the weekly full-history scan
# (and vice versa) -- they scan different things and the cron is the only
# one that sees history. Push runs are keyed on the commit SHA rather than
# the ref: a group holds one running and one pending run, and a newer run
# replaces the pending one even without cancel-in-progress, so a ref key
# would drop the scan of a commit pushed during a busy window. Only
# pull-request runs are cancelled: the newer PR head rescans the same diff.
# When called from ci.yml, `github.workflow` is the caller's name and
# `github.event_name` the caller's event; the event segment keeps this group
# distinct from the caller's own, so the scan never cancels the run that
# called it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Full history so the schedule run can see everything.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action v2 requires a license for any repo owned by a
          # GitHub organization (free for OSS / individual-owned private
          # repos). Store the key from gitleaks.io as a repo or org secret
          # named GITLEAKS_LICENSE. Leaving it unset on an org repo causes
          # the action to fail with "License key is required."
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Pin the scanner binary. gitleaks-action ships its OWN default
          # (8.24.3), so without this line the gate silently runs a different
          # version from the local pre-commit hook -- and scanner versions do
          # not always agree on what is a secret. Keep in lockstep with the
          # local hook's pin; measured identical to 8.24.3 on a multi-vendor
          # fixture before choosing, so this is a deliberate match rather than
          # "take the newest".
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
