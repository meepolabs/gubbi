# Secret scanning -- adopted from meepo-conventions baseline.
#
# Runs on every PR + push to main, plus a weekly full-history scan to
# catch anything historical that slipped past the diff scan on prior
# PRs.

name: gitleaks

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'

# Cancel redundant runs on the same branch. Keyed on event_name too so the
# weekly scheduled full-history scan is never cancelled by a push to the same
# ref (and vice versa).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so the schedule run can see everything.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action v2 requires a license for any repo owned by a
          # GitHub organization (free for OSS / individual-owned private
          # repos). Store the key from gitleaks.io as a repo or org secret
          # named GITLEAKS_LICENSE. Leaving it unset on an org repo causes
          # the action to fail with "License key is required."
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Pin the scanner binary. gitleaks-action ships its OWN default
          # (8.24.3), so without this line the gate silently runs a different
          # version from the local pre-commit hook -- and scanner versions do
          # not always agree on what is a secret. Keep in lockstep with the
          # local hook's pin; measured identical to 8.24.3 on a multi-vendor
          # fixture before choosing, so this is a deliberate match rather than
          # "take the newest".
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
