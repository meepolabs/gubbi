# PR-time lint + type-check gate -- adopted from meepo-conventions baseline.
#
# Adapted to gubbi: only lint + typecheck. The test surface is already
# covered by security-tests.yml (unit tests + RLS + encryption integration
# tests with a postgres service container); duplicating a generic pytest
# job here would just slow CI without adding signal.

name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

# Cancel redundant runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        id: cached-poetry-dependencies
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: .venv
          key: venv-lint-${{ runner.os }}-poetry2.4.1-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: ruff check
        run: poetry run ruff check gubbi/ tests/

      - name: ruff format --check
        run: poetry run ruff format --check gubbi/ tests/

      - name: mypy
        run: poetry run mypy gubbi/
