# CI orchestrator: every blocking lane runs from this workflow, and the
# terminal `required` job is the single check branch protection names.
#
# Lanes:
#   - lint + typecheck (this file)
#   - security-tests.yml (called): env-contract check, unit suite, and the
#     Postgres-backed security suite with its coverage gate
#   - gitleaks.yml (called): secret scan. It also keeps its own push and
#     schedule triggers; its push runs are grouped per commit SHA, so a newer
#     push that cancels this run never drops the scan of an earlier commit.
#   - image-closure (this file): replays the production image's hash-pinned
#     Poetry install when the diff can affect it
#
# The advisory dependency-scan.yml is deliberately NOT a lane of `required`:
# an advisory finding must not block unrelated work.

name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

# Cancel redundant runs on the same branch. Called workflows run inside this
# run and see this workflow's name as `github.workflow`, so none of them may
# declare a concurrency group that evaluates to this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      # Runs on a cache hit too: the cache is keyed on poetry.lock alone, so a
      # pyproject.toml edited without relocking would otherwise go unnoticed.
      - name: Verify poetry.lock matches pyproject.toml
        run: poetry check --lock

      # The `-poetry<version>-` literal is what Renovate's poetry regex
      # matches; keep it a literal, not an expression.
      - name: Cache Poetry virtualenv
        id: cached-poetry-dependencies
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: .venv
          key: venv-lint-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-poetry2.4.1-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: ruff check
        run: poetry run ruff check gubbi/ tests/ tools/

      - name: ruff format --check
        run: poetry run ruff format --check gubbi/ tests/ tools/

      - name: mypy
        run: poetry run mypy gubbi/ tools/ --strict

  security-tests:
    name: security-tests
    uses: ./.github/workflows/security-tests.yml
    permissions:
      contents: read

  secret-scan:
    name: secret scan
    uses: ./.github/workflows/gitleaks.yml
    # At least what gitleaks.yml declares; the action lists PR commits.
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit

  # Proves the hash-pinned Poetry closure the production image installs still
  # installs. The Dockerfile installs Poetry from a pip-compile lock of Poetry
  # plus its transitive dependencies; bumps move only the `poetry` pin (with
  # the Dockerfile's POETRY_VERSION) while the transitive pins stay frozen, so
  # a Poetry release whose metadata conflicts with a frozen pin would otherwise
  # first fail at image build time on deploy. No other job builds the image.
  #
  # The first step skips the install when the diff from the base touches none
  # of the paths the decision script watches, and runs it whenever the base
  # cannot be read. A skipped install leaves the job green, which `required`
  # accepts. The full history is fetched so the base object is present.
  #
  # The base image is read from the Dockerfile's FROM line at run time, so a
  # base-image bump cannot leave this testing a different interpreter than the
  # one the image ships.
  image-closure:
    name: poetry closure installs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCKERFILE: deployment/Dockerfile
      REQUIREMENTS: deployment/poetry-requirements.txt
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Standard library only, on the runner's own python3: nothing to install.
      - name: decide whether the closure can be affected
        id: decide
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/image_closure_needed.py --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Install the Poetry closure in the image's base
        if: ${{ steps.decide.outputs.run != 'false' }}
        run: |
          set -eu
          base_image=$(sed -n 's/^FROM[[:space:]]\{1,\}\([^[:space:]]*\).*/\1/p' "$DOCKERFILE")
          test -n "$base_image"
          test "$(printf '%s\n' "$base_image" | wc -l)" -eq 1
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -e DOCKERFILE -e REQUIREMENTS "$base_image" sh -eu -c '
            docker_version=$(sed -n "s/^[[:space:]]*POETRY_VERSION=\([^[:space:]]*\).*/\1/p" "/workspace/$DOCKERFILE")
            requirements_version=$(sed -n "s/^poetry==\([^[:space:]]*\).*/\1/p" "/workspace/$REQUIREMENTS")
            if [ -z "$docker_version" ] || [ "$docker_version" != "$requirements_version" ]; then
              echo "POETRY_VERSION in $DOCKERFILE (\"$docker_version\") does not match the poetry pin in $REQUIREMENTS (\"$requirements_version\")" >&2
              exit 1
            fi
            python -m venv /tmp/poetry
            /tmp/poetry/bin/pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r "/workspace/$REQUIREMENTS"
            /tmp/poetry/bin/poetry --version'

  # Branch protection names only this job, so renaming or adding a lane is an
  # edit to `needs` below rather than to the protection settings. It must run
  # even when a lane fails (`always()`): a skipped required check counts as
  # passing. A skipped lane fails it too, so a lane that silently stops
  # running cannot pass as green. Every other job in this file belongs in
  # `needs`; the needs check below enforces that here rather than in a lane,
  # so dropping a lane cannot also drop the check.
  required:
    name: required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - lint
      - security-tests
      - secret-scan
      - image-closure
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # Standard library only, on the runner's own python3: nothing to install.
      - name: needs lists every other job
        run: python3 tools/check_required_needs.py --self-test .github/workflows/ci.yml

      - name: every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          echo "dependency results: $RESULTS"
          if printf '%s' "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "required: at least one job did not succeed" >&2
            exit 1
          fi
          printf '%s' "$RESULTS" | grep -q '"success"' || { echo "required: no results" >&2; exit 1; }
