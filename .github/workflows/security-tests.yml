# Tier-1 fast gate, called from ci.yml as a lane of its `required` check
# (every push to main + develop and every PR). Call-only: it has no triggers
# of its own, so it never runs a second time beside the ci run.
#
# Runs lint-adjacent security invariants plus the full Postgres-only test
# surface:
#   1. Unit suite (crypto, db_context, cipher_guard, oauth, auth middleware,
#      ...) -- no service container needed.
#   2. Every database-backed suite, against two pgvector service clusters,
#      through one runner: tools/run_db_suites.py --ci resets the clusters
#      (roles from tools/testdb/bootstrap.sql, then `alembic upgrade head`),
#      runs the integration + e2e + api + extraction + security + storage
#      suites with `-m "not hosted_live"`, then the crypto + RLS coverage gate
#      (>= 80%). Its stage table is pinned by tests/unit/test_run_db_suites.py;
#      this file's shape by tests/unit/test_ci_workflow_contract.py.
#
# Tier-2 (full cross-service live E2E against live Hydra + Kratos + cloud-api)
# runs separately on the operator's dev server via gubbi-testbench. Tests that
# need the full multi-service stack are marked `hosted_live` and are excluded
# from this lane.
#
# Test selection is MARKER-DRIVEN, not a hand-maintained file list: new
# Postgres-only integration tests are gated automatically the moment they land.

name: security-tests

# No workflow-level concurrency: inside a called workflow `github.workflow`
# is the caller's name, so the usual group would equal ci.yml's own and cancel
# the run that called it. ci.yml's group already cancels superseded runs.
on:
  workflow_call:

jobs:
  env-contract-lint:
    name: Env-contract drift lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 2.4.1
      - name: Verify poetry.lock matches pyproject.toml
        run: poetry check --lock
      - run: poetry install --no-interaction --no-root --only ci-tools
      # gubbi-cloud is private; checking it out from this public-repo workflow
      # would require a PAT. Skip the cross-repo Environment Literal
      # parity check here -- it runs in gubbi-cloud's CI (which can check out
      # public gubbi), so Environment Literal drift is still caught on PRs that touch
      # either side of the parity contract.
      - run: poetry run python tools/check_env_contract.py --cloud-config ""

  unit-tests:
    name: Unit suite (no service container)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      JOURNAL_OPERATOR_EMAIL: operator@test.local
      # Pre-encoded 32-byte key that base64-decodes to 32 bytes of 0x01 --
      # reproducible, not secret. Only matters for tests that build a real
      # cipher from the env loader; the fixture cipher uses a fixed key.
      JOURNAL_ENCRYPTION_MASTER_KEY_V1: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Verify poetry.lock matches pyproject.toml
        run: poetry check --lock

      # The `-poetry<version>-` literal is what Renovate's poetry regex
      # matches; keep it a literal, not an expression.
      - name: Cache Poetry virtualenv
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-poetry2.4.1-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Unit tests (no DB)
        # tests/unit is service-free; -m "not hosted_live" is defensive (the
        # unit dir carries no live-stack tests today).
        run: poetry run pytest tests/unit -m "not hosted_live" --tb=short

  # The service images and the client major are not written here. This job
  # reads them from tools/testdb/testdb.env through that file's one validator,
  # so CI and a local stack run the same images with no second copy to drift.
  # It lives in this file rather than in ci.yml because `needs` outputs do not
  # cross a workflow_call boundary; it is required through this lane.
  testdb-config:
    name: Test database image pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      PGVECTOR_IMAGE: ${{ steps.pins.outputs.PGVECTOR_IMAGE }}
      PG_MAJOR: ${{ steps.pins.outputs.PG_MAJOR }}
      REDIS_IMAGE: ${{ steps.pins.outputs.REDIS_IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      # check-env is the one testdb.env validator: any line outside its strict
      # KEY=value rule fails this job before a service is started.
      - name: Validate and export the image pins
        id: pins
        run: python3 tools/testdb/testdb.py check-env --github-output "$GITHUB_OUTPUT"

  security-tests:
    name: Security invariants (RLS + encryption + unit)
    needs: testdb-config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        image: ${{ needs.testdb-config.outputs.PGVECTOR_IMAGE }}
        env:
          POSTGRES_DB: journal_test
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: testpass
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U journal -d journal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # A SECOND, throwaway cluster on its own port. The missing-required-role
      # contracts need a role to be genuinely ABSENT, and roles are cluster-global:
      # staging that on the working cluster above would mean dropping a shared role,
      # which is unrecoverable (the harness captures four attributes, not the
      # password or rolconfig it would need to restore one). So absence gets its own
      # cluster on the same image. The runner hands its DSN to the one stage that
      # owns those contracts and to no other.
      postgres_disposable:
        image: ${{ needs.testdb-config.outputs.PGVECTOR_IMAGE }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: testpass
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U journal -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      JOURNAL_OPERATOR_EMAIL: operator@test.local
      # The fixture cipher uses a fixed key; this env var only matters for tests
      # that construct a real cipher from the env loader. Pre-encoded 32-byte
      # key that base64-decodes to 32 bytes of 0x01 -- reproducible, not secret.
      JOURNAL_ENCRYPTION_MASTER_KEY_V1: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      # The 1 MB < 100 ms AES-GCM perf test (tests/unit/test_crypto.py) is
      # already skipped by default via the ``slow`` pytest marker. If we ever
      # want CI to exercise it, opt in with ``-m slow`` and add a CI-only
      # relaxation; shared GitHub runners sometimes emulate AES and can
      # exceed 100 ms even for correct implementations.

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Verify poetry.lock matches pyproject.toml
        run: poetry check --lock

      # The `-poetry<version>-` literal is what Renovate's poetry regex
      # matches; keep it a literal, not an expression.
      - name: Cache Poetry virtualenv
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-poetry2.4.1-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      # The audit_log dedup repair / invariant tests shell out to `psql` and to
      # deployment/scripts/verify-db-invariants.sh, and they FAIL rather than skip
      # when psql is absent -- so the client is a job prerequisite, not an extra.
      # It is installed from PGDG at the major the pinned server image provides,
      # taken from testdb.env rather than restated here: the runner image ships
      # whatever client major it happens to ship, and a client older than the
      # server can fail on newer catalog output.
      - name: Install PostgreSQL client
        env:
          PG_MAJOR: ${{ needs.testdb-config.outputs.PG_MAJOR }}
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSfL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "postgresql-client-${PG_MAJOR}"
          # PGDG installs to a versioned dir; put it ahead of the runner image's
          # own client so `psql` on PATH is the pinned major for every later step.
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Verify psql major matches the pin
        env:
          PG_MAJOR: ${{ needs.testdb-config.outputs.PG_MAJOR }}
        run: |
          set -euo pipefail
          psql --version
          actual=$(psql --version | sed -E 's/^psql \(PostgreSQL\) ([0-9]+).*/\1/')
          if [[ "${actual}" != "${PG_MAJOR}" ]]; then
            echo "psql major is ${actual}, expected ${PG_MAJOR}" >&2
            exit 1
          fi

      - name: Wait for Postgres to accept connections
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U journal -d journal_test >/dev/null 2>&1; then
              echo "Postgres ready after ${i} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready in 30 seconds"
          exit 1

      - name: Run the database-backed suites
        env:
          # The job's own service clusters, as superuser DSNs. reset --ci wipes
          # and rebuilds them (roles from tools/testdb/bootstrap.sql, then the
          # migrations) and is honoured only when GITHUB_ACTIONS=true.
          TESTDB_PG_URL: postgresql://journal:testpass@localhost:5433/postgres
          TESTDB_PG_DISPOSABLE_URL: postgresql://journal:testpass@localhost:5434/postgres
        run: python3 tools/run_db_suites.py --ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-${{ github.run_id }}
          path: .coverage
          if-no-files-found: ignore
