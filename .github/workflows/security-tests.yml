# Tier-1 fast gate (every push to develop + every PR).
#
# Runs lint-adjacent security invariants plus the full Postgres-only test
# surface:
#   1. Unit suite (crypto, db_context, cipher_guard, oauth, auth middleware,
#      ...) -- no service container needed.
#   2. Integration + e2e + api + extraction + security + storage tests that
#      need ONLY a single Postgres (pgvector/pg17) service. Selected by
#      marker: everything that is NOT `hosted_live`.
#
# Tier-2 (full cross-service live E2E against live Hydra + Kratos + cloud-api)
# runs separately on the operator's dev server via gubbi-testbench. Tests that
# need the full multi-service stack are marked `hosted_live` and are excluded
# here via `-m "not hosted_live"`.
#
# Test selection is MARKER-DRIVEN, not a hand-maintained file list: new
# Postgres-only integration tests are gated automatically the moment they land.
#
# Coverage gate: the security-critical crypto + RLS primitives
# (gubbi/core/crypto.py, cipher_guard.py, db_context.py) must keep combined
# coverage >= 80%. The repository-layer modules (storage/repositories/*) are
# intentionally NOT on this gate; their correctness is exercised end-to-end by
# the integration suite, and narrow line-coverage will return to the gate when
# their dedicated tests are rewritten against the squashed baseline.
#
# Branch protection on `main` + `develop`: require `security-tests` to pass
# before merge.
#
# QUARANTINE (historical): a set of tests pre-dated the 0001 squashed baseline
# and were temporarily excluded via an `--ignore` block here while they were
# rewritten against it. That block has been retired -- the tests now gate in
# the integration job below. A few individual tests remain `@pytest.mark.skip`
# in-file with documented reasons (concurrent-conflict recovery pending a
# prod-side SAVEPOINT, the squashed baseline's by-design lack of a per-step
# downgrade, and otel_ro posture which is bootstrapped only in Tier-2).

name: security-tests

on:
  pull_request:
  push:
    branches:
      - main
      - develop

# Cancel redundant runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  env-contract-lint:
    name: Env-contract drift lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # gubbi-cloud is private; checking it out from this public-repo workflow
      # would require a PAT. Skip the cross-repo Environment Literal
      # parity check here -- it runs in gubbi-cloud's CI (which can check out
      # public gubbi), so Environment Literal drift is still caught on PRs that touch
      # either side of the parity contract.
      - run: python tools/check_env_contract.py --cloud-config ""

  unit-tests:
    name: Unit suite (no service container)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      JOURNAL_OPERATOR_EMAIL: operator@test.local
      # Pre-encoded 32-byte key that base64-decodes to 32 bytes of 0x01 --
      # reproducible, not secret. Only matters for tests that build a real
      # cipher from the env loader; the fixture cipher uses a fixed key.
      JOURNAL_ENCRYPTION_MASTER_KEY_V1: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Unit tests (no DB)
        # tests/unit is service-free; -m "not hosted_live" is defensive (the
        # unit dir carries no live-stack tests today).
        run: poetry run pytest tests/unit -m "not hosted_live" --tb=short

  security-tests:
    name: Security invariants (RLS + encryption + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: journal_test
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: testpass
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U journal -d journal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Consumed by tests/conftest.py (legacy + RLS fixtures).
      TEST_DATABASE_URL: postgresql://journal:testpass@localhost:5433/journal_test
      TEST_DATABASE_URL_RLS: postgresql://journal:testpass@localhost:5433/journal_rls_test
      JOURNAL_OPERATOR_EMAIL: operator@test.local
      # The fixture cipher uses a fixed key; this env var only matters for tests
      # that construct a real cipher from the env loader. Pre-encoded 32-byte
      # key that base64-decodes to 32 bytes of 0x01 -- reproducible, not secret.
      JOURNAL_ENCRYPTION_MASTER_KEY_V1: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      # The 1 MB < 100 ms AES-GCM perf test (tests/unit/test_crypto.py) is
      # already skipped by default via the ``slow`` pytest marker. If we ever
      # want CI to exercise it, opt in with ``-m slow`` and add a CI-only
      # relaxation; shared GitHub runners sometimes emulate AES and can
      # exceed 100 ms even for correct implementations.

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Wait for Postgres to accept connections
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U journal -d journal_test >/dev/null 2>&1; then
              echo "Postgres ready after ${i} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready in 30 seconds"
          exit 1

      - name: Bootstrap database roles
        # The 0001 squashed baseline ASSUMES journal_app + journal_admin already
        # exist (in testbench/prod they are pre-created by an init script). The
        # raw GitHub Postgres service has neither, so the conftest `pool` /
        # `_rls_provisioned` fixtures would silently skip on a GRANT failure.
        # Create the two roles here so the RLS + encryption integration tests
        # actually run. otel_ro is created by the baseline migration itself.
        # journal_app/journal_admin passwords are set by the RLS conftest via
        # ALTER ROLE, so no password is needed at creation time.
        env:
          PGPASSWORD: testpass
        run: |
          psql -h localhost -p 5433 -U journal -d journal_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'journal_app') THEN
                  CREATE ROLE journal_app LOGIN;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'journal_admin') THEN
                  CREATE ROLE journal_admin LOGIN BYPASSRLS CREATEROLE;
              END IF;
          END $$;
          SQL

      - name: Integration tests (Postgres-only; excludes hosted_live live-stack)
        # MARKER-DRIVEN: every Postgres-only test under these dirs gates here.
        # `-m "not hosted_live"` excludes the live-stack E2E (Hydra + Kratos +
        # cloud-api) that runs in Tier-2 on the testbench.
        #
        # The pre-0001-baseline quarantine --ignore block has been retired: the
        # affected tests were rewritten against the squashed baseline and now
        # gate here. A handful of individual tests remain skipped in-file with a
        # documented reason (concurrent-conflict recovery that needs a prod-side
        # SAVEPOINT, the by-design no-downgrade on the squashed baseline, and
        # otel_ro posture which is bootstrapped only in Tier-2).
        run: |
          poetry run pytest \
            tests/integration tests/e2e tests/api tests/extraction tests/security tests/storage \
            -m "not hosted_live" \
            --tb=short

      - name: Coverage gate - crypto + RLS primitives must stay >= 80%
        run: |
          poetry run pytest \
            tests/unit \
            tests/integration/test_rls_isolation.py \
            tests/integration/test_entries_encryption.py \
            tests/integration/test_encryption_contract.py \
            tests/integration/test_encryption_correctness.py \
            tests/integration/test_repo_inserts_under_rls.py \
            --cov=gubbi.core.crypto \
            --cov=gubbi.core.cipher_guard \
            --cov=gubbi.core.db_context \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-${{ github.run_id }}
          path: .coverage
          if-no-files-found: ignore
