[tool.poetry]
name = "gubbi"
version = "0.3.1"
description = "Personal journal MCP server - append-only historical record with semantic memory"
authors = ["madhukar01 <mholla8@gmail.com>"]
license = "AGPL-3.0-or-later"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "~3.12"
fastapi = "^0.136.1"
uvicorn = "^0.34.0"
pydantic = "^2.13.2"  # Harmonised floor with gubbi-cloud.
pydantic-settings = "^2.7.0"
structlog = "^24.4.0"
gunicorn = "^23.0.0"
# STILL TIGHT, and the reason is unchanged: gubbi/tools/registry.py plus 4
# test files reach into mcp._mcp_server / mcp._tool_manager._tools (private
# FastMCP internals), so any minor can break us silently. The registry fails
# loudly rather than silently (getattr + raise) which is the mitigation.
#
# Moved off 1.26 to close GHSA-jpw9-pfvf-9f58: HTTP transports served session
# requests without verifying the authenticated principal, and this server
# serves streamable-http for multi-tenant journal data. The other two
# advisories in that batch do not reach us (no WebSocket transport, no
# experimental task handlers).
#
# The 1.26 comment named an exit condition -- upstream a public API, or add an
# upgrade-time guard test -- and NEITHER is met. Recorded rather than papered
# over: the empirical guard is the 5 MCP test files that run against the live
# docker-compose stack in gubbi-testbench, not a hand-written shim. 1.28 is
# also upstream's own recommended position for staying on v1 (`>=1.28,<2`).
# v1.x is in maintenance mode (security fixes only), so the real fix is the
# v2 migration -- filed, and it owns the private-internals question.
mcp = ">=1.28.1,<1.29"
bcrypt = "^5.0.0"
# PostgreSQL async driver + pgvector extension codec
asyncpg = "^0.30.0"
pgvector = "^0.3.6"
# ONNX embeddings (all-MiniLM-L6-v2, CPU-only, ~80MB)
onnxruntime = ">=1.14,<2"
tokenizers = ">=0.22,<0.23"  # TIGHT: 0.x; BPE semantics have shipped breaking minor changes.
numpy = ">=1.24,<3"  # Already crossed 1->2 silently; cap to gate the next major.
requests = ">=2.33,<3"
httpx = ">=0.28,<0.29"  # Harmonised with gubbi-cloud (which overrides the private _merge_cookies).
PyJWT = {version = ">=2.12,<3", extras = ["crypto"]}  # TIGHT: token verification; major bumps changed default algorithms.
# Was held at <47 on the grounds that "major bumps deprecate algorithms".
# Checked rather than assumed: this package imports exactly ONE thing from
# cryptography -- AESGCM (gubbi/crypto/cipher.py) plus the InvalidTag
# exception. AESGCM is untouched across 47..50, so the deprecation risk the
# old cap guarded against does not apply to our usage.
#
# Moved to close 4 advisories. Three are unreachable here (PKCS#7 EnvelopedData,
# X.509 path building, certificate-verifier wildcard handling -- none of those
# APIs appear in this tree); GHSA-537c-gmf6-5ccf is a vulnerable OpenSSL bundled
# in the wheels, which does affect us and only a wheel bump fixes.
#
# Still capped at one major: widen only after re-checking that whatever AEAD
# this module uses is not on the next major's deprecation list.
cryptography = ">=50,<51"
# Database migrations
alembic = "^1.14.0"
sqlalchemy = "^2.0.0"
psycopg = {version = "^3.2.0", extras = ["binary"]}  # Required by alembic env.py URL rewrite to postgresql+psycopg://.
aiosqlite = ">=0.22,<0.23"  # TIGHT: 0.x; pre-1.0 minors have shipped Connection/cursor API tweaks. Match tokenizers/httpx pin style.
cachetools = ">=5.5,<6"

# OpenTelemetry instrumentation packages are pre-1.0 betas with breaking
# instrumentor-class signature changes between minor versions. Cap below
# 1.0 to surface those bumps as PR review work, not silent updates.
opentelemetry-distro = ">=0.50b0,<1.0"
opentelemetry-instrumentation-fastapi = ">=0.50b0,<1.0"
opentelemetry-instrumentation-httpx = ">=0.50b0,<1.0"
opentelemetry-instrumentation-asyncpg = ">=0.50b0,<1.0"
opentelemetry-instrumentation-redis = ">=0.50b0,<1.0"
opentelemetry-exporter-otlp-proto-grpc = ">=1.27,<2.0"
gubbi-common = { git = "https://github.com/meepolabs/gubbi-common.git", rev = "ec2e7ff", extras = ["db"] }  # journal scope constants + topic/entry audit actions (v0.16.0).

# LLM extraction -- Arq worker + Anthropic API
arq = "^0.26.0"
redis = {version = ">=5.0,<6", extras = ["hiredis"]}
anthropic = "^0.49.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"  # TIGHT: pytest 9 requires pytest-asyncio >= 1.x. 1.0 introduced loop-scope semantics changes; ``asyncio_mode = "auto"`` (see [tool.pytest.ini_options]) auto-marks every coroutine test, so the per-test mark is implicit -- verified clean against 1.3.0 by the full suite. Pin floor matches lock-resolved version so consumers pinning the same constraint get reproducible behavior. Harmonised with gubbi-common + gubbi-cloud (Wave 4). Closes CVE-2025-71176 (pytest <9.0.3 world-readable /tmp/pytest-of-{user} on multi-user hosts).
pytest-cov = "^6.0.0"
pre-commit = "^3.5.0"
# TIGHT: ruff format-rule changes between minors mass-rewrite source, so a
# bump here has to land together with the reformat it causes -- and in lockstep
# with the ruff rev in .pre-commit-config.yaml. Two versions across the local
# hook and the CI gate means they rewrite each other's output: 0.15 collapses
# implicit string concatenation and 0.8 puts it back.
ruff = "^0.15.0"
mypy = "^1.13.0"
types-requests = "==2.33.0.20260402"
types-pyyaml = "==6.0.12.20260408"
hypothesis = "^6.152.1"
asgi-lifespan = "^2.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "B", "I", "N", "UP", "ANN", "S", "A", "C4", "T20", "PT", "RET", "SIM",
    "PERF", "RUF", "TCH",
    # Docstring presence + format. D102/D103 enforce public-method/function
    # docstrings; D200/D205/D400 enforce summary-line format. Per-file ignores
    # below carve out tests, alembic migrations, and MCP tool descriptions
    # (which are surfaced to clients via the tool decorator and follow MCP
    # conventions, not Python docstring style).
    "D102", "D103", "D200", "D205", "D400",
]
ignore = ["ANN401", "N818", "RUF001", "RUF002", "RUF003", "PERF203"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: skip docstring rules entirely; test names are the documentation.
"tests/**/*.py" = ["S101", "PT011", "S105", "S106", "S107", "ANN", "E501", "D", "TCH"]
"gubbi/storage/embedding_service.py" = ["ANN"]
"gubbi/alembic/versions/20260419_0004_add_user_id_to_tenants.py" = ["E501"]
# Alembic migrations are auto-generated; no docstring discipline expected.
"gubbi/alembic/versions/*.py" = ["D"]
# Archived migration chain (frozen under _archive/, not loaded by alembic)
# keeps its original shape; not subject to current docstring or line-length
# rules. Same exemption as the live versions/ dir, plus E501 for the long
# error message in 20260419_0004.
"gubbi/alembic/_archive/*.py" = ["D", "E501"]
# MCP tool descriptions live on the @mcp.tool decorator (surfaced to clients
# in the tool list), not in Python docstrings. D102/D103 do not apply here;
# format rules (D200/D205/D400) still apply for any docstrings that exist.
"gubbi/tools/*.py" = ["D102", "D103"]

[tool.ruff.lint.isort]
known-first-party = ["gubbi"]

[tool.mypy]
# Strict-mode flags are set explicitly rather
# than via `strict = true` so the pre-commit mypy hook (which runs in an
# isolated venv with limited deps) does not emit false positives on
# `disallow_untyped_decorators` for `@mcp.tool` / `@server.exception_handler`.
# Project venv enforces full --strict via `mypy gubbi/ --strict` in CI.
# `disable_error_code = "import-untyped"` covers vendor libs without py.typed
# markers (asyncpg, mcp, opentelemetry-instrumentation-*, onnxruntime, etc.)
# without needing a per-module `[[tool.mypy.overrides]]` block per dep.
# Convergence target: this set is the strictest of the three
# Python repos. Sibling pyprojects (gubbi-common, gubbi-cloud) now mirror
# this list. Drift detection lives in tools/check_env_contract.py-style
# audits at the workspace level.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
strict_equality = true
extra_checks = true
no_implicit_reexport = true
disable_error_code = "import-untyped"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "requests"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "slow: slower tests (e.g. large-input performance checks)",
    "hosted_live: requires a live hosted stack (auth + identity + MCP endpoints reachable); enable with JOURNAL_LIVE_STACK=1 and set JOURNAL_DEV_AUTH_URL / JOURNAL_DEV_IDENTITY_URL / JOURNAL_DEV_MCP_URL",
    "unit: fast, isolated unit tests with no external dependencies",
    "integration: tests that exercise multiple components or require a running service",
]

[tool.coverage.report]
# Ratchet quarterly. Current as of 2026-05-11: 60.55%.
# Locked at floor(current) = 60 (rather than floor+1=61) because the
# precise total sits below 61, so a fail_under=61 gate would flap CI on
# the very first run after this lands. Ratchet plan: when a coverage
# improvement PR pushes the total above 61, bump this to 61. Aspirational
# target is 80%.
fail_under = 60
