# gitleaks config -- default ruleset, NO allowlist.
#
# Every path is scanned: source, tests, docs, CI workflows, lockfiles, and
# .env templates. There is deliberately no [allowlist] -- no directory or file
# is blanket-trusted, so a real secret committed anywhere is surfaced, not
# silently passed. Test fixtures MUST use values that do not match the default
# rules (e.g. no `sk_test_<24+ chars>` shapes, no high-entropy key strings); a
# match is a bug to fix at the source, never an entry to allow.

[extend]
useDefault = true
